[project]
name = "basic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.140.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic"]
typeCheckingMode = "standard"
pythonVersion = "3.14"

reportCallInDefaultInitializer = false
reportUnannotatedClassAttribute = false
reportImplicitOverride = false
reportUnusedCallResult = false
reportImportCycles = false

[tool.ruff]
target-version = "py312"


